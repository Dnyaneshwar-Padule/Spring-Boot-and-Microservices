spring.application.name=42-Many-To-Many-Bidirectional

# mariaDB configurations
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/spring_db
#spring.datasource.username=root
#spring.datasource.password=root

# PostgreSQL Configurations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_db
spring.datasource.username=root
spring.datasource.password=root


# Spring Data JPA configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Flyway properties
# reat the current state of the database as version 1.0 (baseline), and only run new migration scripts from this point forward.
spring.flyway.baseline-on-migrate=true
