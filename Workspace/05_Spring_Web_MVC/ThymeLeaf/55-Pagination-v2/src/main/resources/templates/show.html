<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
    <h3>Employees</h3>

    <table border="1">
        <tr>
            <th>ID</th><th>NAME</th><th>SALARY</th><th>CITY</th>
        </tr>

        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.salary}"></td>
            <td th:text="${employee.city}"></td>
        </tr>
    </table>

    <div style="display: flex; justify-content: center; gap: 10px;">

        <span th:if="${hasPrevious}">
            <a th:href="@{/getAll(page = ${currentPage - 1})}">Previous</a>
        </span>

        <span th:each="i : ${#numbers.sequence(1, totalPages)}" >

            <b th:if="${i == currentPage}" th:text="${i}" style="color: gray;" ></b>

            <a th:if="${i != currentPage}"
               th:text="${i}"
                th:href="@{/getAll(page = ${i})}">
            </a>
        </span>

        <span th:if="${hasNext}">
            <a th:href="@{/getAll(page = ${currentPage + 1})}">Next</a>
        </span>
    </div>
    </div>

</body>
</html>
